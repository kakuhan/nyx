name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Nyx
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - binary: nyx-server
            dir: cmd/server
            goos: linux
            goarch: amd64
          - binary: nyx-server
            dir: cmd/server
            goos: linux
            goarch: arm64
          - binary: nyx-client
            dir: cmd/client
            goos: linux
            goarch: amd64
          - binary: nyx-client
            dir: cmd/client
            goos: linux
            goarch: arm64
          - binary: nyx-client
            dir: cmd/client
            goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd ${{ matrix.dir }}
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.dir }}/${{ matrix.binary }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release/

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
